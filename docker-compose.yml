version: "3"

services:
  minecraft:
    image: itzg/minecraft-server
    volumes:
      - ${MINECRAFT_DATA}:/data
      - ${PLUGINS}:/plugins
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      OPS: "${OPS}"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      VERSION: "${VERSION}"
    tty: true
    stdin_open: true
    restart: unless-stopped
volumes:
  minecraftdata:
    external: true
